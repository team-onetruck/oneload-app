# Date: 2026-10-23
# Author: Jung Minkyu
# Purpose: main의 앱을 검증·빌드해 macserver의 ~/hangil-demo/dist로 배포하는 CD 초안. 관리자 설정 전까지는 수동 실행만 가능하다

name: Deploy

on:
  # 관리자 설정 후 활성화: self-hosted runner 등록과 runner 접근 제한(docs/ci-cd.md 체크리스트)을 마친 뒤 아래 두 줄의 주석을 푼다.
  # push:
  #   branches: [main]
  # 지금은 Actions 탭이나 `gh workflow run deploy.yml`로만 실행된다.
  workflow_dispatch:

permissions:
  contents: read

env:
  # ci.yml과 같은 pnpm 버전을 쓴다.
  PNPM_VERSION: 11.13.0

jobs:
  # 검증과 빌드는 GitHub 호스트 runner에서 한다. macserver에는 Node가 없어도 되고, 서버는 빌드 결과를 받기만 한다.
  build:
    runs-on: ubuntu-latest
    steps:
      # 헤더 검사(scripts/check-header.mjs)가 `git diff main...HEAD`를 쓰므로 ci.yml과 같이 전체 이력과 main 브랜치를 준비한다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 헤더 검사용 main 브랜치 준비
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: corepack으로 pnpm 설치
        run: |
          corepack enable
          corepack install --global "pnpm@$PNPM_VERSION"

      - name: pnpm store 경로 확인
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store 캐시
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      # CI를 통과한 커밋이라도 배포 직전에 한 번 더 검증한다. 실패하면 배포 job은 돌지 않는다.
      - run: pnpm verify

      # VITE_ 환경변수를 넣지 않으므로 API 주소는 기본값(같은 origin의 /api/v1, Caddy가 백엔드로 넘김)을 쓴다.
      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # 다른 브랜치에서 수동 실행해도 배포는 main일 때만 한다.
    if: github.ref == 'refs/heads/main'
    # macserver의 self-hosted runner. oneload-backend의 runner는 그 레포 전용으로 등록돼 있어 이 레포용 등록이 따로 필요하다.
    runs-on: [self-hosted, macOS, hangil]
    # 배포가 겹치면 앞의 배포가 끝날 때까지 기다린다. 중간에 끊으면 dist가 반쯤 바뀐 채 남을 수 있다.
    concurrency:
      group: deploy-hangil-demo
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # README의 수동 배포(rsync -a --delete dist/ macserver:~/hangil-demo/dist/)를 서버 안에서 한다.
      # Caddy(127.0.0.1:4173)가 이 폴더를 그대로 서빙하므로 재시작은 필요 없다.
      - name: dist를 ~/hangil-demo/dist로 동기화
        run: |
          test -d "$HOME/hangil-demo" || { echo "::error::$HOME/hangil-demo가 없습니다. runner 실행 계정을 확인하세요."; exit 1; }
          rsync -a --delete dist/ "$HOME/hangil-demo/dist/"
