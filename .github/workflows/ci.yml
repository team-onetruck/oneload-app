# Date: 2026-10-23
# Author: Jung Minkyu
# Purpose: push와 pull_request마다 pnpm verify를 실행하고, e2e는 별도 job으로 분리하는 CI

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # package.json에 packageManager가 없어서 corepack이 쓸 pnpm 버전을 여기서 고정한다 (로컬과 같은 버전).
  PNPM_VERSION: 11.13.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 헤더 검사(scripts/check-header.mjs)가 `git diff main...HEAD`를 쓰므로 전체 이력이 필요하다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # fetch-depth: 0이어도 main은 origin/main으로만 받아진다. 로컬 main이 없으면 만든다.
      - name: 헤더 검사용 main 브랜치 준비
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: corepack으로 pnpm 설치
        run: |
          corepack enable
          corepack install --global "pnpm@$PNPM_VERSION"

      - name: pnpm store 경로 확인
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store 캐시
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  # verify와 needs로 묶지 않아 서로의 성공·실패에 영향을 주지 않고 각자 결과가 보인다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 작업 6에서 test:e2e 스크립트가 생기기 전까지는 건너뛴다.
      - name: test:e2e 스크립트 확인
        id: e2e-script
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json에 test:e2e 스크립트가 없어 e2e를 건너뜁니다."
          fi

      - name: corepack으로 pnpm 설치
        if: steps.e2e-script.outputs.present == 'true'
        run: |
          corepack enable
          corepack install --global "pnpm@$PNPM_VERSION"

      - name: pnpm store 경로 확인
        if: steps.e2e-script.outputs.present == 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store 캐시
        if: steps.e2e-script.outputs.present == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - if: steps.e2e-script.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # 브라우저(~/.cache/ms-playwright)는 설치된 @playwright/test 버전으로 캐시한다. 버전이 같으면 받는 chromium도 같다.
      - name: Playwright 버전 확인
        if: steps.e2e-script.outputs.present == 'true'
        id: playwright
        run: |
          version="$(pnpm exec playwright --version | awk '{print $2}')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Playwright 브라우저 캐시
        if: steps.e2e-script.outputs.present == 'true'
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      # 캐시가 없으면 @playwright/test 버전에 맞는 chromium과 시스템 라이브러리를 함께 받는다.
      - name: Playwright chromium 설치
        if: steps.e2e-script.outputs.present == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # 캐시가 있으면 브라우저는 확인만 하고 시스템 라이브러리(apt) 설치는 건너뛴다. apt 미러가 느리면 이 단계가 몇 분씩 걸렸다.
      # chromium 실행에 필요한 라이브러리는 러너 이미지에 이미 있고, install-deps가 더하는 것은 폰트와 업그레이드뿐이다
      # (CJK 폰트가 없어 실패 트레이스 스크린샷의 한국어는 네모로 보인다. e2e에는 스크린샷 비교가 없다).
      # 러너 이미지가 바뀌어 브라우저 실행이 missing dependencies로 실패하면 이 단계에 install-deps를 되살리거나 캐시 키를 바꿀 것.
      - name: Playwright chromium 확인 (캐시 사용, 시스템 라이브러리 설치 생략)
        if: steps.e2e-script.outputs.present == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium

      - if: steps.e2e-script.outputs.present == 'true'
        run: pnpm test:e2e

      # 실패한 테스트의 트레이스(playwright.config.ts의 trace: 'retain-on-failure')를 내려받아 볼 수 있게 올린다.
      - name: 실패 트레이스 올리기
        if: failure() && steps.e2e-script.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
